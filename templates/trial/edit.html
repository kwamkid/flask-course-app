<!-- templates/trial/edit_class.html -->
{% extends "base.html" %}
{% block title %}แก้ไขคลาสทดลองเรียน{% endblock %}
{% block content %}

<div class="container-fluid mt-4">
  <h1 class="h3 mb-4 text-primary">แก้ไขคลาสทดลองเรียน</h1>

  <div class="card shadow mb-4">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label for="title">ชื่อคลาสทดลองเรียน <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="title" name="title" value="{{ trial_class.title }}" required>
        </div>

        <div class="form-group">
          <label for="description">รายละเอียด</label>
          <textarea class="form-control" id="description" name="description" rows="3">{{ trial_class.description }}</textarea>
        </div>

        <div class="form-group">
          <label for="course_id">คอร์สที่เกี่ยวข้อง</label>
          <select class="form-control" id="course_id" name="course_id">
            <option value="">ไม่เกี่ยวข้องกับคอร์สใด</option>
            {% for course in courses %}
              <option value="{{ course.id }}" {% if trial_class.course_id == course.id %}selected{% endif %}>
                {{ course.title }}
              </option>
            {% endfor %}
          </select>
          <small class="form-text text-muted">เลือกคอร์สที่เกี่ยวข้องกับการทดลองเรียนนี้ (หากมี)</small>
        </div>

        <div class="form-group">
          <label for="max_students">จำนวนนักเรียนสูงสุดต่อช่วงเวลา <span class="text-danger">*</span></label>
          <input type="number" class="form-control" id="max_students" name="max_students"
                 min="1" max="50" value="{{ trial_class.max_students }}" required>
          <small class="form-text text-muted">จำนวนนักเรียนสูงสุดที่สามารถจองในแต่ละช่วงเวลา</small>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> บันทึกข้อมูล
          </button>
          <a href="{{ url_for('trial.index') }}" class="btn btn-secondary">
            <i class="fas fa-times"></i> ยกเลิก
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
